# Contact form Worker. Separate from the site preview (../../wrangler.toml).
# Deploy steps: README.md in this folder.
name = "ccd-contact"
main = "worker.js"
compatibility_date = "2026-08-04"

# Runs only on the form's endpoint; every other URL still goes to the site.
routes = [
  { pattern = "www.claytoncunninghamdesign.com/api/contact", zone_name = "claytoncunninghamdesign.com" }
]

# Cloudflare Email Routing. The inbox it delivers to is the CONTACT_TO
# secret, kept out of this public repo.
send_email = [
  { name = "MAIL" }
]
