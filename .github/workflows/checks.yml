name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual run: Actions tab → Site checks → Run workflow

# Least privilege: jobs only read the repo unless they ask for more (deploy does).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # generators derive lastmod/dateModified from git history

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate links, JSON-LD, sitemap, llms.txt
        run: node checks/validate-site.mjs

      - name: Generator idempotency (colors, schema, RSS, sitemap, asset hashes)
        run: |
          node inject-colors.mjs
          node inject-schema.mjs
          node generate-rss.mjs
          node generate-sitemap.mjs
          node stamp-assets.mjs
          # lastmod lines shift when the generating commit differs from the
          # committed sitemap's vantage point; everything else must be stable
          git diff --exit-code -I '<lastmod>'

      - name: CSP meta tags match inject-csp.mjs
        run: node inject-csp.mjs --check

      - name: Page load, JavaScript error and CSP check (headless Chrome)
        run: |
          node serve.mjs &
          sleep 2
          node check-csp.mjs

  # Publishes to GitHub Pages only after every check above passes, and only
  # from main. Ships the site files alone: anything listed in .assetsignore
  # (scripts, CLAUDE.md, package files, .github, etc.) stays out, the same
  # list Cloudflare uses. Requires Settings → Pages → Source: GitHub Actions.
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage site files (everything not in .assetsignore)
        run: |
          mkdir _site
          tar --exclude-from=.assetsignore --exclude=./_site -cf - . | tar -xf - -C _site
          echo "Staged $(find _site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # keeps .well-known/security.txt

      - id: deployment
        uses: actions/deploy-pages@v4
